[package]
name = "vbuf-ml"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
vbuf-core = { path = ".." }
vbuf-layout = { path = "../vbuf-layout" }
memmap2 = "0.9"
sha2 = "0.10"
libc = "0.2.186"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = true }
